<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>any-i18n</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <img class="logo" src="../icons/icon-48.png" width="28" height="28" alt="">
      <div class="title">
        <h1>any-i18n</h1>
        <p class="site" id="site">&nbsp;</p>
      </div>
      <button id="settings-btn" class="icon-btn" type="button" data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7L3.4 3.4"/></svg>
      </button>
    </header>

    <button id="provider" class="provider" type="button" data-state="checking">
      <span class="dot" aria-hidden="true"></span>
      <span class="provider-text" id="provider-text">&nbsp;</span>
      <svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
    </button>

    <!-- Pages the browser does not let extensions touch -->
    <section id="restricted" class="restricted" hidden>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
      <p data-i18n="popupRestricted">The browser does not allow translating this page. Open a regular website to translate it.</p>
    </section>

    <section id="main" class="main">
      <label class="label" for="language" data-i18n="popupTranslateInto">Translate into</label>
      <select id="language" class="select"></select>
      <input id="language-other" class="input" type="text" spellcheck="false" autocomplete="off" hidden
             data-i18n-placeholder="popupOtherPlaceholder" placeholder="Language code or name, e.g. ka or Georgian">
      <div id="recent" class="chips" role="group" data-i18n-aria-label="popupRecent" aria-label="Recent languages"></div>

      <div class="action">
        <button id="translate-btn" class="btn btn-primary btn-large" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6M5 1v2M3.5 3c0 2.5 3 4.5 5.5 6M8 7l3 4M11 7l-3 4"/></svg>
          <span id="translate-label">Translate</span>
        </button>

        <div id="progress" class="progress" hidden>
          <div class="progress-row">
            <span class="spinner" aria-hidden="true"></span>
            <span id="progress-text" class="progress-text" role="status" aria-live="polite"></span>
            <button id="stop-btn" class="btn btn-quiet" type="button" data-i18n="actionStop">Stop</button>
          </div>
          <div class="bar"><span id="progress-bar" class="bar-fill"></span></div>
        </div>

        <div id="translated" class="translated" hidden>
          <p class="translated-text">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2.5 8.5 6 12 13.5 4.5"/></svg>
            <span id="translated-text"></span>
          </p>
          <button id="original-btn" class="btn btn-secondary" type="button" data-i18n="actionShowOriginal">Show original</button>
        </div>
      </div>

      <label class="switch-row">
        <span class="switch-text" id="auto-text"></span>
        <span class="switch">
          <input type="checkbox" id="auto-toggle" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </section>

    <details id="tools" class="tools">
      <summary>
        <svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        <span data-i18n="popupTools">Keys and files</span>
        <span id="key-count" class="count">0</span>
      </summary>
      <p class="hint" data-i18n="popupToolsHint">Every string gets a stable key. Export the keys to translate them elsewhere, or import a finished translation file.</p>
      <div class="grid">
        <button id="scan-btn" class="btn btn-secondary" type="button" data-i18n="actionScan">Scan page</button>
        <button id="apply-btn" class="btn btn-secondary" type="button" data-i18n="actionApplyStored">Apply stored</button>
        <button id="export-btn" class="btn btn-secondary" type="button" data-i18n="actionExportKeys">Export keys</button>
        <label class="btn btn-secondary" id="import-label">
          <span data-i18n="actionImport">Import</span>
          <input type="file" id="import-input" accept=".json,application/json" hidden>
        </label>
      </div>
      <div id="keys" class="keys"></div>
    </details>

    <footer class="footer" id="shortcut-hint"></footer>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
